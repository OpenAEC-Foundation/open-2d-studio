<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="841mm" height="594mm" viewBox="0 0 841 594">
  <title>3BM Tekenkader A1 Detailblad</title>

  <!-- Outer border -->
  <rect x="5" y="5" width="831" height="584" fill="none" stroke="#000000" stroke-width="0.7"/>

  <!-- Inner margin frame -->
  <rect x="20" y="20" width="816" height="535" fill="none" stroke="#000000" stroke-width="0.35"/>

  <!-- Title block area (bottom right, 180mm wide, 55mm tall) -->
  <rect x="656" y="555" width="180" height="39" fill="white" stroke="#000000" stroke-width="0.5"/>

  <!-- Title block grid lines -->
  <!-- Horizontal dividers -->
  <line x1="656" y1="568" x2="836" y2="568" stroke="#000000" stroke-width="0.35"/>
  <line x1="656" y1="578" x2="836" y2="578" stroke="#000000" stroke-width="0.35"/>
  <line x1="656" y1="586" x2="836" y2="586" stroke="#000000" stroke-width="0.35"/>

  <!-- Vertical dividers -->
  <line x1="716" y1="555" x2="716" y2="594" stroke="#000000" stroke-width="0.35"/>
  <line x1="776" y1="568" x2="776" y2="594" stroke="#000000" stroke-width="0.35"/>

  <!-- 3BM Label -->
  <text x="686" y="565" font-family="Arial,Helvetica,sans-serif" font-size="7" font-weight="bold"
        text-anchor="middle" fill="#000000">3BM</text>

  <!-- Field labels and placeholders -->
  <text x="658" y="575" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Project</text>
  <text x="658" y="582" font-family="Arial,Helvetica,sans-serif" font-size="4" fill="#000000">{{projectnaam}}</text>

  <text x="718" y="571" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Tekening</text>
  <text x="718" y="577" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{title}}</text>

  <text x="658" y="583.5" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Schaal</text>
  <text x="658" y="589" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{schaal}}</text>

  <text x="718" y="583.5" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Datum</text>
  <text x="718" y="589" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{datum}}</text>

  <text x="778" y="583.5" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Tekeningnr.</text>
  <text x="778" y="589" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{kenmerk}}</text>

  <text x="778" y="575" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Bladnr.</text>
  <text x="778" y="580.5" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{blad}}</text>

  <!-- Revision table (left of title block) -->
  <rect x="476" y="555" width="180" height="39" fill="white" stroke="#000000" stroke-width="0.5"/>
  <text x="478" y="561" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Rev.</text>
  <text x="494" y="561" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Datum</text>
  <text x="518" y="561" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Omschrijving</text>
  <text x="626" y="561" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Gemaakt</text>
  <line x1="476" y1="563" x2="656" y2="563" stroke="#000000" stroke-width="0.35"/>
  <line x1="476" y1="572" x2="656" y2="572" stroke="#000000" stroke-width="0.35"/>
  <line x1="476" y1="581" x2="656" y2="581" stroke="#000000" stroke-width="0.35"/>
  <line x1="493" y1="555" x2="493" y2="594" stroke="#000000" stroke-width="0.35"/>
  <line x1="517" y1="555" x2="517" y2="594" stroke="#000000" stroke-width="0.35"/>
  <line x1="625" y1="555" x2="625" y2="594" stroke="#000000" stroke-width="0.35"/>

  <!-- Drawn by area -->
  <rect x="20" y="555" width="100" height="39" fill="white" stroke="#000000" stroke-width="0.35"/>
  <text x="22" y="561" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Gemaakt door</text>
  <text x="22" y="567" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{auteur}}</text>
  <text x="22" y="575" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Gecontroleerd</text>
  <text x="22" y="581" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{checkedby}}</text>

  <!-- Paper size indicator -->
  <text x="836" y="5" font-family="Arial,Helvetica,sans-serif" font-size="3" fill="#000000" text-anchor="end">A1</text>
</svg>
