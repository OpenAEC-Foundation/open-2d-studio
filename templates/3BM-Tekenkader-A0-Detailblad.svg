<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1189mm" height="841mm" viewBox="0 0 1189 841">
  <title>3BM Tekenkader A0 Detailblad</title>

  <!-- Outer border -->
  <rect x="5" y="5" width="1179" height="831" fill="none" stroke="#000000" stroke-width="0.7"/>

  <!-- Inner margin frame -->
  <rect x="20" y="20" width="1164" height="782" fill="none" stroke="#000000" stroke-width="0.35"/>

  <!-- Title block area (bottom right, 200mm wide, 55mm tall) -->
  <rect x="984" y="786" width="200" height="55" fill="white" stroke="#000000" stroke-width="0.5"/>

  <!-- Title block grid lines -->
  <line x1="984" y1="799" x2="1184" y2="799" stroke="#000000" stroke-width="0.35"/>
  <line x1="984" y1="812" x2="1184" y2="812" stroke="#000000" stroke-width="0.35"/>
  <line x1="984" y1="824" x2="1184" y2="824" stroke="#000000" stroke-width="0.35"/>
  <line x1="984" y1="834" x2="1184" y2="834" stroke="#000000" stroke-width="0.35"/>

  <line x1="1054" y1="786" x2="1054" y2="841" stroke="#000000" stroke-width="0.35"/>
  <line x1="1124" y1="799" x2="1124" y2="841" stroke="#000000" stroke-width="0.35"/>

  <!-- 3BM Label -->
  <text x="1019" y="797" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="bold"
        text-anchor="middle" fill="#000000">3BM</text>

  <!-- Field labels and placeholders -->
  <text x="986" y="808" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Project</text>
  <text x="986" y="818" font-family="Arial,Helvetica,sans-serif" font-size="4.5" fill="#000000">{{projectnaam}}</text>

  <text x="1056" y="804" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Tekening</text>
  <text x="1056" y="810" font-family="Arial,Helvetica,sans-serif" font-size="4" fill="#000000">{{title}}</text>

  <text x="986" y="820" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Schaal</text>
  <text x="986" y="827" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{schaal}}</text>

  <text x="1056" y="820" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Datum</text>
  <text x="1056" y="827" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{datum}}</text>

  <text x="1126" y="820" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Tekeningnr.</text>
  <text x="1126" y="827" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{kenmerk}}</text>

  <text x="1126" y="808" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Bladnr.</text>
  <text x="1126" y="814" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{blad}}</text>

  <text x="986" y="830" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Gemaakt door</text>
  <text x="986" y="837" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{auteur}}</text>

  <text x="1056" y="830" font-family="Arial,Helvetica,sans-serif" font-size="2.5" fill="#666666">Gecontroleerd</text>
  <text x="1056" y="837" font-family="Arial,Helvetica,sans-serif" font-size="3.5" fill="#000000">{{checkedby}}</text>

  <!-- Revision table (left of title block) -->
  <rect x="784" y="786" width="200" height="55" fill="white" stroke="#000000" stroke-width="0.5"/>
  <text x="786" y="793" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Rev.</text>
  <text x="802" y="793" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Datum</text>
  <text x="826" y="793" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Omschrijving</text>
  <text x="940" y="793" font-family="Arial,Helvetica,sans-serif" font-size="2.5" font-weight="bold" fill="#000000">Gemaakt</text>
  <line x1="784" y1="795" x2="984" y2="795" stroke="#000000" stroke-width="0.35"/>
  <line x1="784" y1="807" x2="984" y2="807" stroke="#000000" stroke-width="0.35"/>
  <line x1="784" y1="819" x2="984" y2="819" stroke="#000000" stroke-width="0.35"/>
  <line x1="801" y1="786" x2="801" y2="841" stroke="#000000" stroke-width="0.35"/>
  <line x1="825" y1="786" x2="825" y2="841" stroke="#000000" stroke-width="0.35"/>
  <line x1="939" y1="786" x2="939" y2="841" stroke="#000000" stroke-width="0.35"/>

  <!-- Paper size indicator -->
  <text x="1184" y="10" font-family="Arial,Helvetica,sans-serif" font-size="3" fill="#000000" text-anchor="end">A0</text>
</svg>
