[package]
name = "prototype-03-egui-ribbon"
version.workspace = true
edition.workspace = true

[dependencies]
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
egui_dock = "0.14"
# egui-wgpu 0.29 requires wgpu 22, NOT 0.20. Pin same version across crates.
wgpu = "22"
winit = "0.30"
pollster = "0.3"
anyhow = { workspace = true }

[[bin]]
name = "prototype-03"
path = "src/main.rs"
