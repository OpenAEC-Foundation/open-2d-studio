[package]
name = "dwg-parser"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
serde_json = "1"
# Rayon work-stealing thread pool — used to parallelise
# `parse_objects_r2000` (~700k objects on test65.dwg). Each handle
# decodes independently from the immutable `data: &[u8]` slice via
# `parse_single_object_r2000(&self, ...)`, so the loop is embarrassingly
# parallel. On an 8-core test machine this brings the parse phase from
# ~160 s to ~25 s on test65.dwg.
rayon = "1.10"

[features]
# Enables verbose `[dwg-dbg]` traces from the parser to stderr.
# Off by default — debug prints are silent in normal builds.
# Build with: `cargo build --release --features dwg-debug`
dwg-debug = []
